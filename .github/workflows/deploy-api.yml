name: Deploy API

# ─────────────────────────────────────────────────────────────
# Triggers
# Only runs when code is merged into main.
# CI must pass first — if CI fails, this never runs.
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]

jobs:
  deploy-api:
    name: Deploy NestJS to Railway
    runs-on: ubuntu-latest

    # Map secrets to env vars at job level.
    # This allows us to check if they are set before attempting deployment.
    # If RAILWAY_TOKEN is not configured, the deploy step is skipped cleanly.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read automatically from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install Railway CLI globally so it is available in PATH for the deploy step.
      # pnpm dlx was wrong here — it runs in a temporary context and does not
      # persist the binary. npm install -g puts it in the system PATH correctly.
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Only runs if RAILWAY_TOKEN secret is configured in GitHub repo settings.
      # Skips cleanly with no error if the secret is not yet set.
      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        working-directory: apps/api
        run: railway up --service resume-analyzer-api --detach

# ─────────────────────────────────────────────────────────────
# Required GitHub Secrets (repo Settings → Secrets → Actions)
# ─────────────────────────────────────────────────────────────
# RAILWAY_TOKEN  → railway.app → Account Settings → Tokens → Create
#
# The --detach flag means the pipeline does not wait for the full
# rollout — Railway handles the deployment asynchronously.
# ─────────────────────────────────────────────────────────────
