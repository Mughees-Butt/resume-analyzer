name: Deploy Web

# ─────────────────────────────────────────────────────────────
# Triggers
# Only runs when code is merged into main.
# CI must pass first — if CI fails, this never runs.
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]

jobs:
  deploy-web:
    name: Deploy Next.js to Vercel
    runs-on: ubuntu-latest

    # Map secrets to env vars at job level.
    # This allows us to check if they are set before attempting deployment.
    # If VERCEL_TOKEN is not configured, the deploy step is skipped cleanly.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read automatically from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only runs if VERCEL_TOKEN secret is configured in GitHub repo settings.
      # Skips cleanly with no error if the secret is not yet set.
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/web
        run: pnpm dlx vercel --prod --token=$VERCEL_TOKEN --yes

# ─────────────────────────────────────────────────────────────
# Required GitHub Secrets (repo Settings → Secrets → Actions)
# ─────────────────────────────────────────────────────────────
# VERCEL_TOKEN       → vercel.com → Settings → Tokens → Create
# VERCEL_ORG_ID      → vercel.com → Settings → General → Your ID
# VERCEL_PROJECT_ID  → run `vercel link` in apps/web, then check .vercel/project.json
# ─────────────────────────────────────────────────────────────
